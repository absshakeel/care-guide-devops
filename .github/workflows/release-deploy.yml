name: Release — Build, Push, Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write   # Required for GitHub OIDC → AWS authentication

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  APP_PORT: "8080"

jobs:
  release:
    name: Build, Push, Deploy
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Authenticate to AWS using OIDC (no long-lived access keys)
      # -------------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-release

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------------------------------------------------
      # Determine image tags
      # -------------------------------------------------------------------
      - name: Compute image tags
        id: tags
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          SHA="${GITHUB_SHA::8}"

          # Semantic version: use the git tag if present, else sha
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SEM_VER="${GITHUB_REF#refs/tags/}"
          else
            SEM_VER="sha-${SHA}"
          fi

          {
            echo "registry=${REGISTRY}"
            echo "sha_tag=${REGISTRY}/${REPO}:sha-${SHA}"
            echo "semver_tag=${REGISTRY}/${REPO}:${SEM_VER}"
            echo "sha=${SHA}"
            echo "sem_ver=${SEM_VER}"
          } >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------
      # Multi-platform build with BuildKit layer caching
      # -------------------------------------------------------------------
      - name: Set up QEMU (for arm64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.semver_tag }}
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.sem_ver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      # -------------------------------------------------------------------
      # Deploy to EC2 through AWS Systems Manager (no SSH required)
      # -------------------------------------------------------------------
      - name: Capture previous image tag for rollback
        id: prev
        run: |
          # Retrieve the currently running image tag from the instance via SSM
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["docker inspect careguide-app --format \"{{.Config.Image}}\" 2>/dev/null || echo none"]}' \
            --query "Command.CommandId" \
            --output text)

          # Poll until the invocation is terminal. Reading the output of a
          # still-pending command yields an empty string, and an empty value
          # must never be mistaken for a rollback target.
          STATUS=Pending
          for _ in $(seq 1 12); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo Pending)
            case "${STATUS}" in
              Success|Failed|TimedOut|Cancelled) break ;;
            esac
            sleep 5
          done

          PREV=""
          if [[ "${STATUS}" == "Success" ]]; then
            PREV=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query "StandardOutputContent" \
              --output text | tr -d '[:space:]')
          fi

          # No container yet, or the probe did not report back: nothing to
          # roll back to.
          if [[ -z "${PREV}" ]]; then PREV="none"; fi

          echo "previous_image=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous image: ${PREV}"

      - name: Deploy new image via SSM
        id: deploy
        run: |
          SHA_TAG="${{ steps.tags.outputs.sha_tag }}"
          REGISTRY="${{ steps.tags.outputs.registry }}"
          REGION="${{ env.AWS_REGION }}"

          # Write the remote script to a file first: the commands contain
          # newlines and quotes, so hand-built JSON would be invalid. jq -Rs
          # serialises the whole script into a single properly escaped
          # commands[0] element.
          cat > deploy.sh <<'EOF'
          set -euo pipefail
          aws ecr get-login-password --region REGION_PLACEHOLDER | \
            docker login --username AWS --password-stdin REGISTRY_PLACEHOLDER
          docker pull SHA_TAG_PLACEHOLDER
          docker stop careguide-app 2>/dev/null || true
          docker rm careguide-app 2>/dev/null || true
          docker run -d \
            --name careguide-app \
            --restart unless-stopped \
            -p 8080:8080 \
            -e PORT=8080 \
            -e ENVIRONMENT=production \
            -e LOG_LEVEL=info \
            SHA_TAG_PLACEHOLDER
          EOF

          sed -i \
            -e "s|REGION_PLACEHOLDER|${REGION}|g" \
            -e "s|REGISTRY_PLACEHOLDER|${REGISTRY}|g" \
            -e "s|SHA_TAG_PLACEHOLDER|${SHA_TAG}|g" \
            deploy.sh

          PARAMS=$(jq -Rsc '{commands: [.]}' deploy.sh)
          echo "Remote script to execute:"
          cat deploy.sh

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${PARAMS}" \
            --timeout-seconds 300 \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${CMD_ID}" >> "$GITHUB_OUTPUT"
          echo "Deployment command ID: ${CMD_ID}"

          # Wait for completion
          for _ in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query "Status" --output text 2>/dev/null || echo Pending)
            echo "Status: ${STATUS}"
            if [[ "${STATUS}" == "Success" ]]; then break; fi
            if [[ "${STATUS}" == "Failed" || "${STATUS}" == "TimedOut" || "${STATUS}" == "Cancelled" ]]; then
              echo "Deployment failed with status: ${STATUS}"
              exit 1
            fi
            sleep 10
          done

          # The loop also exits without break after 30 iterations; treat
          # anything other than Success as a failure so the smoke test and the
          # rollback step are not skipped.
          if [[ "${STATUS}" != "Success" ]]; then
            echo "Deployment did not reach Success (last status: ${STATUS})"
            exit 1
          fi

      # -------------------------------------------------------------------
      # Smoke test: verify /health responds correctly
      # -------------------------------------------------------------------
      - name: Smoke test /health endpoint
        id: smoke
        run: |
          # Retrieve the public DNS of the instance
          PUBLIC_DNS=$(aws ec2 describe-instances \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --query "Reservations[0].Instances[0].PublicDnsName" \
            --output text)

          URL="http://${PUBLIC_DNS}:${{ env.APP_PORT }}/health"
          echo "Probing: ${URL}"

          for attempt in $(seq 1 10); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${URL}" 2>/dev/null || echo "000")
            echo "Attempt ${attempt}: HTTP ${STATUS}"
            if [[ "${STATUS}" == "200" ]]; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 5
          done

          echo "Smoke test failed after 10 attempts"
          exit 1

      # -------------------------------------------------------------------
      # Rollback if deploy or smoke test failed. `always()` is required:
      # success() is implicitly ANDed onto every `if`, so a bare
      # `failure() && ...` condition is unreachable.
      # -------------------------------------------------------------------
      - name: Rollback to previous image
        if: ${{ always() && failure() && steps.prev.outputs.previous_image != 'none' && steps.prev.outputs.previous_image != '' }}
        run: |
          PREV="${{ steps.prev.outputs.previous_image }}"
          echo "Rolling back to: ${PREV}"

          cat > rollback.sh <<'EOF'
          set -euo pipefail
          docker stop careguide-app 2>/dev/null || true
          docker rm careguide-app 2>/dev/null || true
          docker run -d --name careguide-app --restart unless-stopped \
            -p 8080:8080 \
            -e PORT=8080 \
            -e ENVIRONMENT=production \
            PREV_PLACEHOLDER
          EOF

          sed -i "s|PREV_PLACEHOLDER|${PREV}|g" rollback.sh

          PARAMS=$(jq -Rsc '{commands: [.]}' rollback.sh)
          echo "Rollback script:"
          cat rollback.sh

          aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${PARAMS}" \
            --timeout-seconds 120
          echo "Rollback initiated"

