# The Secret is intentionally not committed with real values.
#
# To create it before deploying:
#   kubectl create secret generic careguide-app-secret \
#     --namespace careguide \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# In production on EKS, use the AWS Secrets Manager CSI driver or
# External Secrets Operator to sync from AWS Secrets Manager.

apiVersion: v1
kind: Secret
metadata:
  name: careguide-app-secret
  namespace: careguide
  labels:
    app.kubernetes.io/name: careguide-app
type: Opaque
# Data is intentionally empty here — apply via the kubectl command above.
# Never commit plaintext secret values to version control.
stringData: {}

