apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: careguide-app
  namespace: careguide
  labels:
    app.kubernetes.io/name: careguide-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: careguide-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300    # wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

