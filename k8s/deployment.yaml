apiVersion: apps/v1
kind: Deployment
metadata:
  name: careguide-app
  namespace: careguide
  labels:
    app.kubernetes.io/name: careguide-app
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: careguide-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # allow one extra pod during updates
      maxUnavailable: 0    # never reduce below the desired count

  template:
    metadata:
      labels:
        app.kubernetes.io/name: careguide-app
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          image: careguide-devops-app:0.1.0
          imagePullPolicy: IfNotPresent   # use Always for ECR in production

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: careguide-app-config
            - secretRef:
                name: careguide-app-secret
                optional: true   # secret has no mandatory keys right now

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"

          lifecycle:
            preStop:
              exec:
                # Kubernetes removes the pod from the Service endpoints and sends
                # SIGTERM concurrently, and endpoint removal is asynchronous across
                # kube-proxies. Sleeping briefly keeps the old pod serving while the
                # dataplane converges, so in-flight requests are not reset.
                command: ["sh", "-c", "sleep 5"]

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp      # uvicorn writes temporary files here

      volumes:
        - name: tmp
          emptyDir: {}

