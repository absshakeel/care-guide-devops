[build-system]
requires = ["setuptools>=74"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "careguide-devops-app"
version = "0.1.0"
description = "FastAPI demo service for Care Guide DevOps assessment"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "prometheus-client==0.21.1",
    "python-json-logger==3.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.0",
    "ruff==0.8.1",
]

# The repository root is a flat layout containing k8s/, monitoring/, systemd/,
# scripts/ and terraform/ alongside app/. Setuptools refuses to guess in that
# situation, so the single importable package is declared explicitly instead of
# relying on automatic discovery.
[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ANN"]
ignore = [
    "S104",    # Binding to 0.0.0.0 — required for containers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]   # assert and missing annotations are fine in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
