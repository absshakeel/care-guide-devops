# Ingress for local kind cluster using ingress-nginx.
#
# To install ingress-nginx on kind:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
#
# For EKS production, replace with the AWS Load Balancer Controller annotation:
#   kubernetes.io/ingress.class: alb
#   alb.ingress.kubernetes.io/scheme: internet-facing
#   alb.ingress.kubernetes.io/target-type: ip

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: careguide-app
  namespace: careguide
  labels:
    app.kubernetes.io/name: careguide-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: careguide.local   # add to /etc/hosts: 127.0.0.1 careguide.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: careguide-app
                port:
                  name: http

