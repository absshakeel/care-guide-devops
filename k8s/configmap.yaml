apiVersion: v1
kind: ConfigMap
metadata:
  name: careguide-app-config
  namespace: careguide
  labels:
    app.kubernetes.io/name: careguide-app
data:
  PORT: "8080"
  LOG_LEVEL: "info"
  ENVIRONMENT: "kubernetes"
  # APP_VERSION is deliberately NOT set here. It is baked into the image by the
  # release pipeline (--build-arg APP_VERSION=<semver>), and envFrom would
  # silently override that with a stale value. The image's own ENV is
  # authoritative for the version the process reports.

